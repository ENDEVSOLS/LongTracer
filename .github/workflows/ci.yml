name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Check for real errors (E, F rules — no style nits)
        run: ruff check . --select E,F --ignore E501,F401,E402,F541

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install package and test deps
        run: pip install -e "." pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=longtracer --cov-report=term-missing

  test-evalport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-evalport-${{ hashFiles('pyproject.toml') }}

      - name: Install package with the evalport extra
        run: pip install -e ".[evalport]" pytest pytest-cov

      - name: Run full test suite against the real EvalPort validator
        run: pytest tests/ -v --tb=short --cov=longtracer --cov-report=term-missing -W error::pytest.PytestUnraisableExceptionWarning

      - name: Confirm the schema-validation tests actually ran (not skipped)
        run: |
          pytest tests/test_evalport_adapter.py -v -k "validate_result_set or schema" -rs | tee /tmp/evalport_test_output.txt
          if grep -q "SKIPPED" /tmp/evalport_test_output.txt; then
            echo "::error::A real-schema-validation test was skipped even with the evalport extra installed — evalport-sdk import must have failed silently."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, test-evalport]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
